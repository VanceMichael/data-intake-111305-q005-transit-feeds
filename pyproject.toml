[project]
name = "transit-feeds"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transit_feeds", "transit_feeds.fixtures"]

[tool.setuptools.package-dir]
"transit_feeds.fixtures" = "fixtures"

[tool.setuptools.package-data]
"transit_feeds.fixtures" = ["*.json"]
